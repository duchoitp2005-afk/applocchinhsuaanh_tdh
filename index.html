<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Story & Art Generator</title>
    <style>
        :root {
            --primary: #6366f1;
            --background: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--surface);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        h1 { text-align: center; color: var(--primary); margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #475569;
            border-radius: 6px;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
            font-size: 15px;
        }
        textarea { resize: vertical; height: 120px; }
        button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background: #4f46e5; }
        button:disabled { background: #475569; cursor: not-allowed; }
        .result-section { margin-top: 30px; display: none; border-top: 2px solid #334155; padding-top: 20px; }
        .story-output { line-height: 1.8; white-space: pre-wrap; font-size: 16px; margin-bottom: 20px; }
        .image-output { text-align: center; margin-top: 20px; }
        .image-output img { max-width: 100%; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5); }
        .loading { text-align: center; display: none; color: #38bdf8; font-weight: bold; margin: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>Kể Truyện & Vẽ Ảnh Cùng AI</h1>

    <!-- Khu vực nhập Key -->
    <div class="form-group">
        <label for="geminiKey">1. Nhập Gemini API Key (Để viết truyện):</label>
        <input type="password" id="geminiKey" placeholder="AIzaSy...">
        <small style="color: #94a3b8;">Lấy key miễn phí tại Google AI Studio</small>
    </div>

    <div class="form-group">
        <label for="hfKey">2. Nhập Hugging Face Token (Để vẽ ảnh - Tùy chọn):</label>
        <input type="password" id="hfKey" placeholder="hf_...">
        <small style="color: #94a3b8;">Lấy token miễn phí tại Hugging Face (Quyền Read)</small>
    </div>

    <!-- Khu vực nhập nội dung -->
    <div class="form-group">
        <label for="outline">3. Nhập dàn ý hoặc ý tưởng của bạn:</label>
        <textarea id="outline" placeholder="Ví dụ: Một chàng trai nghèo phát hiện ra mình có khả năng ngưng đọng thời gian. Anh ta quyết định dùng nó để đi giải cứu một cô gái..."></textarea>
    </div>

    <button id="generateBtn" onclick="startGeneration()">Bắt đầu sáng tác</button>

    <div class="loading" id="loadingText">AI đang suy nghĩ và vẽ tranh, vui lòng đợi trong giây lát...</div>

    <!-- Khu vực hiển thị kết quả -->
    <div class="result-section" id="resultSection">
        <h2>Cốt truyện được tạo:</h2>
        <div class="story-output" id="storyText"></div>
        
        <h2>Hình ảnh minh họa:</h2>
        <div class="image-output" id="imageContainer"></div>
    </div>
</div>

<script>
    async function startGeneration() {
        const geminiKey = document.getElementById('geminiKey').value.trim();
        const hfKey = document.getElementById('hfKey').value.trim();
        const outline = document.getElementById('outline').value.trim();
        
        const btn = document.getElementById('generateBtn');
        const loading = document.getElementById('loadingText');
        const resultSection = document.getElementById('resultSection');
        const storyText = document.getElementById('storyText');
        const imageContainer = document.getElementById('imageContainer');

        if (!geminiKey || !outline) {
            alert("Vui lòng nhập đầy đủ Gemini Key và Dàn ý truyện!");
            return;
        }

        // Bật trạng thái Loading
        btn.disabled = true;
        loading.style.display = "block";
        resultSection.style.display = "none";
        storyText.innerText = "";
        imageContainer.innerHTML = "";

        try {
            // --- BƯỚC 1: GỌI GEMINI API ĐỂ VIẾT TRUYỆN ---
            const geminiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiKey}`;
            
            const storyPrompt = `Dựa vào dàn ý sau, hãy viết thành một cốt truyện chi tiết, hấp dẫn, văn phong mượt mà bằng tiếng Việt: "${outline}"`;
            
            const geminiResponse = await fetch(geminiUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: storyPrompt }] }]
                })
            });

            const geminiData = await geminiResponse.json();
            if (!geminiResponse.ok) throw new Error(geminiData.error?.message || "Lỗi tạo truyện");
            
            const GeneratedStory = geminiData.candidates[0].content.parts[0].text;
            storyText.innerText = GeneratedStory;
            resultSection.style.display = "block";

            // --- BƯỚC 2: GỌI GEMINI LẦN 2 ĐỂ TẠO PROMPT TIẾNG ANH CHO ẢNH ---
            let imgPrompt = "A fantasy story concept art, cinematic lighting"; // Prompt mặc định
            
            if (hfKey) {
                const promptForImage = `Dựa vào dàn ý này: "${outline}", hãy tạo ra 1 câu prompt ngắn bằng tiếng Anh để AI vẽ tranh minh họa (chỉ trả về câu tiếng Anh, không thêm từ gì khác).`;
                const promptResponse = await fetch(geminiUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptForImage }] }]
                    })
                });
                const promptData = await promptResponse.json();
                if (promptResponse.ok) {
                    imgPrompt = promptData.candidates[0].content.parts[0].text.trim();
                }

                // --- BƯỚC 3: GỌI HUGGING FACE API ĐỂ VẼ ẢNH ---
                // Sử dụng model FLUX.1-schnell rất đẹp và nhanh
                const hfUrl = "https://api-inference.huggingface.co/models/black-forest-labs/FLUX.1-schnell";
                
                const hfResponse = await fetch(hfUrl, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${hfKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ inputs: imgPrompt })
                });

                if (hfResponse.ok) {
                    const blob = await hfResponse.blob();
                    const imgUrl = URL.createObjectURL(blob);
                    imageContainer.innerHTML = `<img src="${imgUrl}" alt="Story Illustration"><p style='font-size:12px; color:#94a3b8; margin-top:5px;'>Prompt gốc của ảnh: <i>${imgPrompt}</i></p>`;
                } else {
                    imageContainer.innerHTML = "<p style='color: #ef4444;'>Không thể tạo ảnh (Có thể do lỗi Hugging Face Token hoặc hết lượt dùng thử).</p>";
                }
            } else {
                imageContainer.innerHTML = "<p style='color: #e2e8f0;'>Bạn không nhập Hugging Face Token nên hệ thống bỏ qua bước vẽ ảnh.</p>";
            }

        } catch (error) {
            alert("Có lỗi xảy ra: " + error.message);
            console.error(error);
        } finally {
            // Tắt trạng thái loading
            btn.disabled = false;
            loading.style.display = "none";
        }
    }
</script>

</body>
</html>
