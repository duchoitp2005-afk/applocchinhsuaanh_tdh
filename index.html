<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI PowerPoint Slide Generator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #ec4899;
            --primary-hover: #db2777;
            --text: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 { text-align: center; color: var(--primary); margin-bottom: 25px; font-size: 26px; }
        .form-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        label { font-weight: bold; margin-bottom: 6px; font-size: 14px; }
        input, textarea {
            padding: 12px;
            background: #334155;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            width: 100%;
        }
        textarea { height: 100px; resize: none; }
        
        button {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        button:hover { background: var(--primary-hover); }
        button:disabled { background: #64748b; cursor: not-allowed; }
        
        .loading { display: none; text-align: center; color: #f472b6; font-weight: bold; margin: 20px 0; }
        
        /* Khu vực trình chiếu Slide */
        .presentation-container {
            display: none;
            margin-top: 30px;
            text-align: center;
        }
        .slide-viewer {
            width: 100%;
            aspect-ratio: 16/9;
            background: linear-gradient(135deg, #1e1b4b 0%, #311042 100%);
            border: 4px solid #475569;
            border-radius: 8px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            box-sizing: border-box;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }
        .slide-title {
            font-size: 32px;
            color: #f472b6;
            margin-bottom: 20px;
            font-weight: 800;
        }
        .slide-content {
            font-size: 18px;
            line-height: 1.6;
            color: #e2e8f0;
            text-align: left;
            max-width: 85%;
        }
        .slide-content ul {
            margin: 0;
            padding-left: 20px;
        }
        .slide-content li {
            margin-bottom: 10px;
        }
        
        /* Thanh điều khiển chuyển trang */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }
        .nav-btn {
            width: auto;
            padding: 10px 20px;
            background: #475569;
            margin: 0;
        }
        .nav-btn:hover { background: #334155; }
        .slide-number {
            font-size: 16px;
            font-weight: bold;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>AI PowerPoint Slide Generator</h1>
    
    <div class="form-group">
        <label>Gemini API Key:</label>
        <input type="password" id="geminiKey" placeholder="Dán mã AIzaSy... sạch của bạn tại đây">
    </div>
    <div class="form-group">
        <label>Chủ đề bài thuyết trình hoặc Nội dung dàn ý:</label>
        <textarea id="topic" placeholder="Ví dụ: Lịch sử phát triển của Trí tuệ nhân tạo AI, hoặc một bài báo cáo doanh thu cụ thể..."></textarea>
    </div>

    <button id="genBtn" onclick="generateSlides()">Bắt đầu thiết kế Slide</button>
    
    <div class="loading" id="loading">AI đang lên nội dung và dàn trang Slide PowerPoint, vui lòng chờ...</div>

    <div class="presentation-container" id="presContainer">
        <div class="slide-viewer" id="slideViewer">
            <div class="slide-title" id="slideTitle">Tiêu đề Slide</div>
            <div class="slide-content" id="slideContent">Nội dung Slide</div>
        </div>
        
        <div class="controls">
            <button class="nav-btn" onclick="prevSlide()">◀ Slide trước</button>
            <div class="slide-number" id="slideNum">Slide 1 / 1</div>
            <button class="nav-btn" onclick="nextSlide()">Slide sau ▶</button>
        </div>
    </div>
</div>

<script>
    let slidesData = [];
    let currentSlideIndex = 0;

    async function generateSlides() {
        const geminiKey = document.getElementById('geminiKey').value.trim();
        const topic = document.getElementById('topic').value.trim();
        const btn = document.getElementById('genBtn');
        const loading = document.getElementById('loading');
        const presContainer = document.getElementById('presContainer');

        if(!geminiKey || !topic) {
            alert("Vui lòng nhập đầy đủ API Key và Chủ đề!");
            return;
        }

        btn.disabled = true;
        loading.style.display = "block";
        presContainer.style.display = "none";

        try {
            const geminiUrl = `https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent?key=${geminiKey}`;
            
            const systemPrompt = `Bạn là một chuyên gia thiết kế bài thuyết trình PowerPoint chuyên nghiệp. Hãy phân tích chủ đề sau và tạo ra một bài thuyết trình gồm từ 4 đến 7 slide logic và cuốn hút.
            Hãy trả về kết quả DUY NHẤT dưới dạng chuỗi mảng JSON chuẩn (Không bọc ký tự cuộn code \`\`\`json, không từ ngữ thừa).
            Cấu trúc JSON yêu cầu chính xác như sau:
            [
              {
                "title": "Tiêu đề Slide 1 (Mở đầu cực hay)",
                "bullets": ["Ý chính thứ nhất ngắn gọn", "Ý chính thứ hai rõ ràng", "Ý chính thứ ba đắt giá"]
              },
              {
                "title": "Tiêu đề Slide 2",
                "bullets": ["Nội dung chính phát triển chủ đề", "Số liệu hoặc luận điểm làm rõ"]
              }
            ]
            Chủ đề thuyết trình: "${topic}"`;

            const res = await fetch(geminiUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: systemPrompt }] }] })
            });

            if(!res.ok) throw new Error("API Key không chính xác hoặc lỗi hệ thống.");

            const data = await res.json();
            let rawText = data.candidates[0].content.parts[0].text.trim();
            
            // Làm sạch JSON
            rawText = rawText.replace(/^```json/i, '').replace(/^```/, '').replace(/```$/, '').trim();
            slidesData = JSON.parse(rawText);

            // Reset về slide đầu tiên và hiển thị
            currentSlideIndex = 0;
            renderSlide();
            presContainer.style.display = "block";

        } catch (error) {
            alert("Có lỗi xảy ra: " + error.message);
            console.error(error);
        } finally {
            btn.disabled = false;
            loading.style.display = "none";
        }
    }

    // Hàm vẽ nội dung Slide hiện tại lên màn hình
    function renderSlide() {
        if(slidesData.length === 0) return;
        
        const slide = slidesData[currentSlideIndex];
        document.getElementById('slideTitle').innerText = slide.title;
        
        // Tạo danh sách dấu chấm đầu dòng (Bullet points)
        let htmlContent = "<ul>";
        slide.bullets.forEach(bullet => {
            htmlContent += `<li>${bullet}</li>`;
        });
        htmlContent += "</ul>";
        
        document.getElementById('slideContent').innerHTML = htmlContent;
        document.getElementById('slideNum').innerText = `Slide ${currentSlideIndex + 1} / ${slidesData.length}`;
    }

    function nextSlide() {
        if(currentSlideIndex < slidesData.length - 1) {
            currentSlideIndex++;
            renderSlide();
        }
    }

    function prevSlide() {
        if(currentSlideIndex > 0) {
            currentSlideIndex--;
            renderSlide();
        }
    }
</script>

</body>
</html>
