<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUT .Cube Viewer & Processor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #4fc3f7; }
        .container {
            max-width: 1000px;
            width: 100%;
            background: #2a2a35;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .upload-section {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
            padding: 15px;
            background: #333344;
            border-radius: 6px;
        }
        .file-input {
            flex: 1;
            min-width: 250px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #ffb74d;
        }
        input[type="file"] {
            width: 100%;
            padding: 8px;
            background: #222;
            border: 1px solid #555;
            color: #fff;
            border-radius: 4px;
        }
        .preview-area {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
        }
        .canvas-container {
            text-align: center;
            flex: 1;
            min-width: 300px;
        }
        canvas, img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            background: #111;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .status {
            margin-top: 10px;
            font-style: italic;
            color: #a7ffeb;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Bộ Xem và Áp Dụng File LUT (.cube)</h1>
    <p>Tải ảnh và file LUT của bạn lên để xem kết quả thay đổi màu sắc thời gian thực.</p>

    <div class="upload-section">
        <div class="file-input">
            <label for="imageLoader">1. Chọn hình ảnh (JPG/PNG):</label>
            <input type="file" id="imageLoader" accept="image/*">
        </div>
        <div class="file-input">
            <label for="lutLoader">2. Chọn file màu LUT (.cube):</label>
            <input type="file" id="lutLoader" accept=".cube">
        </div>
    </div>

    <div id="status" class="status">Hệ thống sẵn sàng. Vui lòng chọn đủ Ảnh và file LUT.</div>

    <div class="preview-area">
        <div class="canvas-container">
            <h3>Ảnh gốc</h3>
            <img id="originalImage" src="" alt="Chưa có ảnh" style="display:none;">
            <canvas id="canvasOriginal"></canvas>
        </div>
        <div class="canvas-container">
            <h3>Ảnh đã áp dụng LUT</h3>
            <canvas id="canvasResult"></canvas>
        </div>
    </div>
</div>

<script>
    const imageLoader = document.getElementById('imageLoader');
    const lutLoader = document.getElementById('lutLoader');
    const canvasOriginal = document.getElementById('canvasOriginal');
    const canvasResult = document.getElementById('canvasResult');
    const ctxOrig = canvasOriginal.getContext('2d');
    const ctxRes = canvasResult.getContext('2d');
    const statusDiv = document.getElementById('status');

    let loadedImage = null;
    let lutData = null;

    // 1. Lắng nghe sự kiện up ảnh
    imageLoader.addEventListener('change', handleImage, false);
    // 2. Lắng nghe sự kiện up file LUT
    lutLoader.addEventListener('change', handleLUT, false);

    function handleImage(e) {
        const reader = new FileReader();
        reader.onload = function(event) {
            img = new Image();
            img.onload = function() {
                loadedImage = img;
                canvasOriginal.width = img.width;
                canvasOriginal.height = img.height;
                canvasResult.width = img.width;
                canvasResult.height = img.height;
                
                ctxOrig.drawImage(img, 0, 0);
                ctxRes.drawImage(img, 0, 0); // Tạm thời vẽ ảnh gốc lên kết quả
                
                statusDiv.innerText = "Đã tải ảnh thành công.";
                applyLUT();
            }
            img.src = event.target.result;
        }
        if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
    }

    function handleLUT(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            const text = event.target.result;
            lutData = parseCubeLUT(text);
            if (lutData) {
                statusDiv.innerText = `Đã tải LUT: Kích thước khối ${lutData.size}x${lutData.size}x${lutData.size}`;
                applyLUT();
            } else {
                statusDiv.innerText = "Lỗi: File .cube không đúng định dạng chuẩn.";
            }
        };
        reader.readAsText(file);
    }

    // Bộ Parse file .cube thành cấu trúc mảng 3D mã màu
    function parseCubeLUT(text) {
        const lines = text.split('\n');
        let size = 0;
        let data = [];
        let domainMin = [0, 0, 0];
        let domainMax = [1, 1, 1];

        for (let i = 0; i < lines.length; i++) {
            let line = lines[i].trim();
            if (line === '' || line.startsWith('#')) continue;

            const parts = line.split(/\s+/);

            if (parts[0] === 'LUT_3D_SIZE') {
                size = parseInt(parts[1]);
                continue;
            }
            if (parts[0] === 'DOMAIN_MIN') {
                domainMin = [parseFloat(parts[1]), parseFloat(parts[2]), parseFloat(parts[3])];
                continue;
            }
            if (parts[0] === 'DOMAIN_MAX') {
                domainMax = [parseFloat(parts[1]), parseFloat(parts[2]), parseFloat(parts[3])];
                continue;
            }

            // Đọc các dòng chứa dữ liệu màu RGB (Thường từ 0.0 đến 1.0)
            if (parts.length === 3 && !isNaN(parseFloat(parts[0]))) {
                data.push([
                    parseFloat(parts[0]),
                    parseFloat(parts[1]),
                    parseFloat(parts[2])
                ]);
            }
        }

        if (size === 0 || data.length !== size * size * size) {
            return null; // File lỗi hoặc không đủ data
        }

        return { size, data, domainMin, domainMax };
    }

    // Hàm áp dụng LUT lên từng pixel của Canvas
    function applyLUT() {
        if (!loadedImage || !lutData) return;

        statusDiv.innerText = "Đang xử lý ảnh với LUT...";
        
        // Lấy dữ liệu pixel từ ảnh gốc
        const imgData = ctxOrig.getImageData(0, 0, canvasOriginal.width, canvasOriginal.height);
        const pixels = imgData.data;
        const size = lutData.size;
        const lut = lutData.data;

        // Vòng lặp xử lý từng pixel (R, G, B, A)
        for (let i = 0; i < pixels.length; i += 4) {
            let r = pixels[i] / 255;
            let g = pixels[i+1] / 255;
            let b = pixels[i+2] / 255;

            // Tìm vị trí Index trong khối 3D LUT (Nội suy tuyến tính đơn giản gần nhất)
            let rIdx = Math.min(Math.floor(r * (size - 1)), size - 1);
            let gIdx = Math.min(Math.floor(g * (size - 1)), size - 1);
            let bIdx = Math.min(Math.floor(b * (size - 1)), size - 1);

            // Công thức tính vị trí index trong mảng phẳng 1 chiều của file .cube 
            // Thứ tự lưu phổ biến của .cube là R chạy nhanh nhất, rồi tới G, rồi tới B
            let lutIndex = rIdx + gIdx * size + bIdx * size * size;

            if (lut[lutIndex]) {
                pixels[i]   = Math.min(Math.max(lut[lutIndex][0] * 255, 0), 255); // R mới
                pixels[i+1] = Math.min(Math.max(lut[lutIndex][1] * 255, 0), 255); // G mới
                pixels[i+2] = Math.min(Math.max(lut[lutIndex][2] * 255, 0), 255); // B mới
            }
        }

        // Vẽ kết quả ra canvas bên phải
        ctxRes.putImageData(imgData, 0, 0);
        statusDiv.innerText = "Áp dụng hiệu ứng LUT thành công!";
    }
</script>

</body>
</html>
