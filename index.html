<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#121212">
    <title>Sopcare - AI Slider Cam Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        header {
            width: 100%;
            max-width: 500px;
            text-align: center;
            padding: 10px 0 20px 0;
        }

        header h1 {
            font-size: 1.4rem;
            color: #00fff0;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 240, 0.3);
        }

        header p {
            font-size: 0.8rem;
            color: #888;
            margin-top: 5px;
        }

        .studio-container {
            width: 100%;
            max-width: 500px;
            background: #1e1e1e;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid #2a2a2a;
        }

        /* Khung hiển thị ảnh */
        .preview-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .preview-box canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .upload-label {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 255, 240, 0.2);
            border: 1px solid #00fff0;
            color: #00fff0;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.2s;
        }

        .upload-label:active {
            background: #00fff0;
            color: #000;
        }

        #file-input {
            display: none;
        }

        /* Khung điều khiển Sliders */
        .control-group {
            margin-bottom: 18px;
        }

        .control-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: #aaa;
        }

        .control-label span:last-child {
            color: #00fff0;
            font-family: monospace;
        }

        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #333;
            border-radius: 3px;
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #00fff0;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 255, 240, 0.5);
        }

        /* Nút chức năng */
        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-reset {
            background: #2a2a2a;
            color: #aaa;
            border: 1px solid #333;
        }

        .btn-reset:active {
            background: #333;
        }

        .btn-export {
            background: linear-gradient(135deg, #00fff0, #00b8ff);
            color: #000;
            box-shadow: 0 4px 15px rgba(0, 255, 240, 0.3);
        }

        .btn-export:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header>
        <h1>Sopcare</h1>
        <p>AI Slider Cam Studio • LUT Generator</p>
    </header>

    <div class="studio-container">
        <div class="preview-box">
            <canvas id="preview-canvas"></canvas>
            <label for="file-input" class="upload-label">Đổi ảnh mẫu</label>
            <input type="file" id="file-input" accept="image/*">
        </div>

        <div class="control-group">
            <div class="control-label">
                <span>Độ sáng (Brightness)</span>
                <span id="val-brightness">1.00</span>
            </div>
            <input type="range" id="slider-brightness" class="slider" min="0.5" max="1.5" step="0.02" value="1">
        </div>

        <div class="control-group">
            <div class="control-label">
                <span>Độ tương phản (Contrast)</span>
                <span id="val-contrast">1.00</span>
            </div>
            <input type="range" id="slider-contrast" class="slider" min="0.5" max="1.5" step="0.02" value="1">
        </div>

        <div class="control-group">
            <div class="control-label">
                <span>Độ bão hòa màu (Saturation)</span>
                <span id="val-saturation">1.00</span>
            </div>
            <input type="range" id="slider-saturation" class="slider" min="0.0" max="2.0" step="0.04" value="1">
        </div>

        <div class="btn-container">
            <button class="btn-reset" onclick="resetSliders()">Đặt lại</button>
            <button class="btn-export" onclick="exportToCube()">Xuất file .CUBE</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('preview-canvas');
        const ctx = canvas.getContext('2d');
        const fileInput = document.getElementById('file-input');

        // Khởi tạo ảnh mặc định (Ảnh phong cảnh giả lập để test màu ban đầu)
        let originalImage = new Image();
        
        // Tạo ảnh màu gốc gradient nếu chưa upload ảnh mới
        function createDefaultSample() {
            canvas.width = 640;
            canvas.height = 360;
            // Tạo một hình ảnh mẫu đầy màu sắc để người dùng dễ nhìn thấy sự thay đổi của LUT
            let grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grad.addColorStop(0, '#ff0055');
            grad.addColorStop(0.5, '#00ffaa');
            grad.addColorStop(1, '#0055ff');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Vẽ thêm vài chi tiết khối để test độ tương phản
            ctx.fillStyle = "rgba(255,255,255,0.8)";
            ctx.fillRect(100, 80, 150, 150);
            ctx.fillStyle = "rgba(0,0,0,0.6)";
            ctx.fillRect(380, 120, 160, 150);
            
            originalImage.src = canvas.toDataURL();
        }

        // Lắng nghe sự kiện kéo slider để cập nhật số hiển thị và cập nhật ảnh vẽ
        const sliders = ['brightness', 'contrast', 'saturation'];
        sliders.forEach(id => {
            const el = document.getElementById(`slider-${id}`);
            el.addEventListener('input', () => {
                document.getElementById(`val-${id}`).innerText = parseFloat(el.value).toFixed(2);
                applyFilters();
            });
        });

        // Xử lý khi người dùng upload ảnh mới của họ lên
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    originalImage = new Image();
                    originalImage.onload = () => {
                        // Tính toán giữ nguyên tỉ lệ ảnh
                        canvas.width = originalImage.width;
                        canvas.height = originalImage.height;
                        applyFilters();
                    };
                    originalImage.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Hàm áp dụng hiệu ứng lên Canvas để xem trước (Live Preview)
        function applyFilters() {
            if (!originalImage.src) return;
            
            const b = document.getElementById('slider-brightness').value;
            const c = document.getElementById('slider-contrast').value;
            const s = document.getElementById('slider-saturation').value;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Sử dụng CSS filter của Canvas để render thời gian thực cực mượt
            // Biến đổi giá trị sang định dạng chuẩn của CSS
            const brightnessPercent = b * 100;
            const contrastPercent = c * 100;
            const saturatePercent = s * 100;

            ctx.filter = `brightness(${brightnessPercent}%) contrast(${contrastPercent}%) saturate(${saturatePercent}%)`;
            ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);
        }

        // Hàm Đặt lại các thông số về mặc định (1.0)
        function resetSliders() {
            sliders.forEach(id => {
                document.getElementById(`slider-${id}`).value = 1;
                document.getElementById(`val-${id}`).innerText = "1.00";
            });
            applyFilters();
        }

        // THUẬT TOÁN QUAN TRỌNG: Tạo ma trận màu 3D và xuất file .CUBE chuẩn Blackmagic
        function exportToCube() {
            const bSetting = parseFloat(document.getElementById('slider-brightness').value);
            const cSetting = parseFloat(document.getElementById('slider-contrast').value);
            const sSetting = parseFloat(document.getElementById('slider-saturation').value);

            const size = 33; // Kích thước ma trận 3D LUT tiêu chuẩn cho thiết bị phần cứng
            let cubeContent = `TITLE "Sopcare_AI_Studio_LUT"\n`;
            cubeContent += `LUT_3D_SIZE ${size}\n\n`;

            // Chạy 3 vòng lặp lồng nhau cho 3 trục màu R, G, B
            for (let b = 0; b < size; b++) {
                for (let g = 0; g < size; g++) {
                    for (let r = 0; r < size; r++) {
                        // Tọa độ màu gốc trong không gian [0.0 - 1.0]
                        let rOrig = r / (size - 1);
                        let gOrig = g / (size - 1);
                        let bOrig = b / (size - 1);

                        // 1. Áp dụng Độ sáng (Brightness)
                        let rNew = rOrig * bSetting;
                        let gNew = gOrig * bSetting;
                        let bNew = bOrig * bSetting;

                        // 2. Áp dụng Độ tương phản (Contrast quanh điểm neo trung tâm 0.5)
                        rNew = (rNew - 0.5) * cSetting + 0.5;
                        gNew = (gNew - 0.5) * cSetting + 0.5;
                        bNew = (bNew - 0.5) * cSetting + 0.5;

                        // 3. Áp dụng Độ bão hòa màu (Saturation qua công thức tính Luma tiêu chuẩn)
                        const luma = 0.2126 * rNew + 0.7152 * gNew + 0.0722 * bNew;
                        rNew = luma + (rNew - luma) * sSetting;
                        gNew = luma + (gNew - luma) * sSetting;
                        bNew = luma + (bNew - luma) * sSetting;

                        // Đảm bảo dữ liệu không vượt quá ngưỡng quy định [0.0, 1.0] nhằm tránh lỗi hiển thị trên Monitor
                        rNew = Math.max(0, Math.min(1, rNew)).toFixed(6);
                        gNew = Math.max(0, Math.min(1, gNew)).toFixed(6);
                        bNew = Math.max(0, Math.min(1, bNew)).toFixed(6);

                        // Đẩy dòng dữ liệu màu vào file text
                        cubeContent += `${rNew} ${gNew} ${bNew}\n`;
                    }
                }
            }

            // Tạo lệnh tải xuống trực tiếp trên trình duyệt
            const blob = new Blob([cubeContent], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Sopcare_Studio_Color.cube';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Tự động chạy lần đầu khi mở trang web
        window.onload = () => {
            createDefaultSample();
            setTimeout(applyFilters, 100);
        };
    </script>
</body>
</html>
