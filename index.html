<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>AI PowerPoint Master Pro</title>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/PptxGenJS@3.12.0/dist/pptxgen.bundle.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 500px; background: #1e293b; padding: 25px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #ec4899; }
        .input-group { margin-bottom: 15px; }
        label { font-size: 13px; color: #94a3b8; display: block; margin-bottom: 5px; }
        input, textarea, select, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        button { background: #ec4899; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #db2777; }
        #dlBtn { background: #06b6d4; display: none; }
        #log { font-size: 12px; color: #f472b6; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>AI PowerPoint Pro</h2>
    <input type="password" id="geminiKey" placeholder="Gemini API Key">
    <div class="input-group">
        <label>Tải file (TXT, DOCX, PDF):</label>
        <input type="file" id="fileInput" accept=".txt,.docx,.pdf">
    </div>
    <div class="input-group">
        <label>Chọn chủ đề màu sắc:</label>
        <select id="themeColor">
            <option value="1e1b4b">Xanh Đậm</option>
            <option value="1a4d1a">Xanh Lá</option>
            <option value="7d3c3c">Đỏ Đô</option>
        </select>
    </div>
    <textarea id="topic" rows="3" placeholder="Hoặc nhập chủ đề..."></textarea>
    <button onclick="runAI()">Tạo Slide & Chèn ảnh</button>
    <button id="dlBtn" onclick="downloadPPT()">📥 Tải file .pptx</button>
    <div id="log"></div>
</div>

<script>
    let slidesData = [];
    const log = document.getElementById('log');

    async function runAI() {
        log.innerText = "Đang đọc dữ liệu và hội ý với AI...";
        const file = document.getElementById('fileInput').files[0];
        let content = document.getElementById('topic').value;
        const key = document.getElementById('geminiKey').value;

        try {
            // Xử lý đọc file đa định dạng
            if(file) {
                if(file.name.endsWith(".txt")) content = await file.text();
                else if(file.name.endsWith(".docx")) content = (await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() })).value;
                else if(file.name.endsWith(".pdf")) {
                    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
                    for(let i=1; i<=pdf.numPages; i++) content += (await (await pdf.getPage(i)).getTextContent()).items.map(s => s.str).join(" ") + "\n";
                }
            }

            // Gọi AI
            const res = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-2.0-flash:generateContent?key=${key}`, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: `Tóm tắt thành JSON mảng: [{"title":"...", "body":"...", "keyword":"..."}]. Nội dung: ${content}` }] }] })
            });

            const data = await res.json();
            slidesData = JSON.parse(data.candidates[0].content.parts[0].text.replace(/```json|```/g, ""));
            log.innerText = "Xong! Ảnh đã tìm xong, sẵn sàng tải.";
            document.getElementById('dlBtn').style.display = "block";
        } catch(e) { log.innerText = "Lỗi: Hãy kiểm tra API Key hoặc nội dung file."; }
    }

    function downloadPPT() {
        let pptx = new PptxGenJS();
        const theme = document.getElementById('themeColor').value;

        slidesData.forEach(item => {
            let slide = pptx.addSlide();
            slide.background = { color: theme };
            // Chèn ảnh từ Unsplash, thêm fallback nếu ảnh lỗi
            slide.addImage({ path: `https://source.unsplash.com/800x600/?${item.keyword || 'business'}`, x: 0, y: 0, w: '100%', h: '100%' });
            slide.addShape(pptx.ShapeType.rect, { x:0, y:0, w:'100%', h:'100%', fill:{color:'000000', transparency:60} });
            slide.addText(item.title, { x: 0.5, y: 1, w: '90%', fontSize: 30, bold: true, color: 'FFFFFF' });
            slide.addText(item.body, { x: 0.5, y: 2, w: '90%', fontSize: 18, color: 'FFFFFF' });
        });
        pptx.writeFile({ fileName: "AI_Presentation.pptx" });
    }
</script>
</body>
</html>
