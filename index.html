<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Comic Manga Generator</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --primary: #8b5cf6;
            --text: #f3f4f6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        h1 { text-align: center; color: var(--primary); margin-bottom: 25px; font-size: 24px; }
        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        @media(min-width: 600px) {
            .grid-inputs { grid-template-columns: 1fr 1fr; }
        }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 6px; font-size: 14px; }
        input, textarea {
            padding: 12px;
            background: #26262b;
            border: 1px solid #3f3f46;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            width: 100%;
        }
        textarea { height: 120px; resize: none; }
        .full-width { grid-column: 1 / -1; }
        button {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #7c3aed; }
        button:disabled { background: #4b5563; cursor: not-allowed; }
        .loading { display: none; text-align: center; color: #a78bfa; font-weight: bold; margin: 20px 0; font-size: 15px; }
        
        .comic-book {
            display: none;
            margin-top: 35px;
            border: 4px solid #fff;
            background: #fff;
            padding: 15px;
            border-radius: 4px;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        @media(min-width: 600px) {
            .comic-book { grid-template-columns: 1fr 1fr; }
        }
        .panel {
            position: relative;
            border: 3px solid #000;
            overflow: hidden;
            background: #f3f4f6;
            aspect-ratio: 4/3;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @media(min-width: 600px) {
            .panel-3 { grid-column: 1 / -1; aspect-ratio: 16/7; }
        }
        .panel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .speech-bubble {
            position: absolute;
            top: 10px;
            left: 10px;
            max-width: 75%;
            background: white;
            color: black;
            border: 2px solid black;
            border-radius: 16px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: bold;
            line-height: 1.3;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
            text-align: center;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 15px;
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: white transparent;
            display: block;
            width: 0;
        }
        .speech-bubble::before {
            content: '';
            position: absolute;
            bottom: -11px;
            left: 14px;
            border-width: 9px 9px 0;
            border-style: solid;
            border-color: black transparent;
            display: block;
            width: 0;
        }
        .panel-2 .speech-bubble { left: auto; right: 10px; }
        .panel-2 .speech-bubble::after { left: auto; right: 15px; }
        .panel-2 .speech-bubble::before { left: auto; right: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Hệ Thống Tạo Truyện Tranh Tự Động</h1>
    
    <div class="grid-inputs">
        <div class="form-group">
            <label>Gemini API Key:</label>
            <input type="password" id="geminiKey" placeholder="Dán mã AIzaSy... tại đây">
        </div>
        <div class="form-group">
            <label>Hugging Face Token:</label>
            <input type="password" id="hfKey" placeholder="Dán mã hf_... tại đây">
        </div>
        <div class="form-group full-width">
            <label>Nhập kịch bản / Dàn ý của bạn:</label>
            <textarea id="outline" placeholder="Nhập nội dung truyện tại đây..."></textarea>
        </div>
    </div>

    <button id="genBtn" onclick="generateComic()">Bắt đầu vẽ truyện tranh</button>
    
    <div class="loading" id="loading">Hệ thống đang xử lý và vẽ tranh, vui lòng chờ trong giây lát...</div>

    <div class="comic-book" id="comicBook">
        <div class="panel panel-1" id="p1">
            <div class="speech-bubble" id="dialogue1">...</div>
            <img id="img1" src="" alt="Đang tải..." style="display:none;">
        </div>
        <div class="panel panel-2" id="p2">
            <div class="speech-bubble" id="dialogue2">...</div>
            <img id="img2" src="" alt="Đang tải..." style="display:none;">
        </div>
        <div class="panel panel-3" id="p3">
            <div class="speech-bubble" id="dialogue3">...</div>
            <img id="img3" src="" alt="Đang tải..." style="display:none;">
        </div>
    </div>
</div>

<script>
    async function generateComic() {
        const geminiKey = document.getElementById('geminiKey').value.trim();
        const hfKey = document.getElementById('hfKey').value.trim();
        const outline = document.getElementById('outline').value.trim();
        const btn = document.getElementById('genBtn');
        const loading = document.getElementById('loading');
        const comicBook = document.getElementById('comicBook');

        if(!geminiKey || !hfKey || !outline) {
            alert("Vui lòng điền đầy đủ cả 2 Key và Dàn ý kịch bản!");
            return;
        }

        btn.disabled = true;
        loading.style.display = "block";
        comicBook.style.display = "none";

        try {
            // Sửa đường link API chuẩn mã hóa HTTPS bảo mật cao hơn cho GitHub Pages
            const geminiUrl = `https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent?key=${geminiKey}`;
            
            const systemPrompt = `Bạn là một biên kịch truyện tranh chuyên nghiệp. Hãy chuyển đổi dàn ý sau đây thành đúng 3 phân cảnh liên tiếp. 
            Hãy trả về kết quả DUY NHẤT dưới dạng chuỗi JSON hợp lệ (Không bao gồm bất kỳ từ ngữ nào khác ngoài JSON, không bọc trong ký hiệu cuộn code \`\`\`json).
            Cấu trúc JSON chính xác như sau:
            [
              {"image_prompt": "Detailed English description for image generation, historical Vietnamese comic style, clean lines, colorful", "dialogue": "Lời thoại rất ngắn gọn bằng tiếng Việt cho cảnh 1"},
              {"image_prompt": "Detailed English description for image generation, historical Vietnamese comic style, clean lines, colorful", "dialogue": "Lời thoại rất ngắn gọn bằng tiếng Việt cho cảnh 2"},
              {"image_prompt": "Detailed English description for image generation, historical Vietnamese comic style, clean lines, colorful", "dialogue": "Lời thoại rất ngắn gọn bằng tiếng Việt cho cảnh 3"}
            ]
            Dàn ý truyện: "${outline}"`;

            const geminiRes = await fetch(geminiUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: systemPrompt }] }] })
            });

            if (!geminiRes.ok) throw new Error("Mã Gemini API Key không chính xác hoặc hết hạn.");

            const geminiData = await geminiRes.json();
            let rawText = geminiData.candidates[0].content.parts[0].text.trim();
            
            rawText = rawText.replace(/^```json/i, '').replace(/^```/, '').replace(/```$/, '').trim();
            const comicData = JSON.parse(rawText);

            document.getElementById('dialogue1').innerText = comicData[0].dialogue;
            document.getElementById('dialogue2').innerText = comicData[1].dialogue;
            document.getElementById('dialogue3').innerText = comicData[2].dialogue;

            const hfUrl = "[https://api-inference.huggingface.co/models/black-forest-labs/FLUX.1-schnell](https://api-inference.huggingface.co/models/black-forest-labs/FLUX.1-schnell)";
            
            const fetchImage = async (prompt) => {
                const res = await fetch(hfUrl, {
                    method: "POST",
                    headers: { 
                        "Authorization": `Bearer ${hfKey}`, 
                        "Content-Type": "application/json" 
                    },
                    body: JSON.stringify({ inputs: prompt })
                });
                if(!res.ok) throw new Error("Mã Hugging Face Token chưa đúng hoặc máy chủ AI đang bận.");
                const blob = await res.blob();
                return URL.createObjectURL(blob);
            };

            const [url1, url2, url3] = await Promise.all([
                fetchImage(comicData[0].image_prompt),
                fetchImage(comicData[1].image_prompt),
                fetchImage(comicData[2].image_prompt)
            ]);

            document.getElementById('img1').src = url1; document.getElementById('img1').style.display = "block";
            document.getElementById('img2').src = url2; document.getElementById('img2').style.display = "block";
            document.getElementById('img3').src = url3; document.getElementById('img3').style.display = "block";

            comicBook.style.display = "grid";

        } catch (error) {
            alert("Có lỗi xảy ra: " + error.message + "\nHướng xử lý: Hãy kiểm tra kỹ lại độ chính xác của 2 mã khóa Key.");
            console.error(error);
        } finally {
            btn.disabled = false;
            loading.style.display = "none";
        }
    }
</script>

</body>
</html>
