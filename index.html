<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Comic Manga Generator (Dynamic & Downloadable)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --primary: #8b5cf6;
            --success: #10b981;
            --text: #f3f4f6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        h1 { text-align: center; color: var(--primary); margin-bottom: 25px; font-size: 24px; }
        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        @media(min-width: 600px) {
            .grid-inputs { grid-template-columns: 1fr 1fr; }
        }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 6px; font-size: 14px; }
        input, textarea {
            padding: 12px;
            background: #26262b;
            border: 1px solid #3f3f46;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            width: 100%;
        }
        textarea { height: 120px; resize: none; }
        .full-width { grid-column: 1 / -1; }
        
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        button {
            width: 100%;
            padding: 15px;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        #genBtn { background: var(--primary); }
        #genBtn:hover { background: #7c3aed; }
        #dlBtn { background: var(--success); display: none; }
        #dlBtn:hover { background: #059669; }
        button:disabled { background: #4b5563; cursor: not-allowed; }
        
        .loading { display: none; text-align: center; color: #a78bfa; font-weight: bold; margin: 20px 0; font-size: 15px; }
        
        /* Khung truyện tranh */
        .comic-wrapper {
            margin-top: 35px;
            padding: 15px;
            background: #fff; /* Nền trắng chuẩn truyện tranh khi xuất file */
            border: 4px solid #000;
            border-radius: 4px;
        }
        .comic-book {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        @media(min-width: 600px) {
            .comic-book { grid-template-columns: 1fr 1fr; }
        }
        .panel {
            position: relative;
            border: 3px solid #000;
            overflow: hidden;
            background: #f3f4f6;
            aspect-ratio: 4/3;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .panel.full-row {
            grid-column: 1 / -1;
            aspect-ratio: 16/7;
        }
        .panel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .speech-bubble {
            position: absolute;
            top: 10px;
            left: 10px;
            max-width: 75%;
            background: white;
            color: black;
            border: 2px solid black;
            border-radius: 16px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: bold;
            line-height: 1.3;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
            text-align: center;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 15px;
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: white transparent;
            display: block;
            width: 0;
        }
        .speech-bubble::before {
            content: '';
            position: absolute;
            bottom: -11px;
            left: 14px;
            border-width: 9px 9px 0;
            border-style: solid;
            border-color: black transparent;
            display: block;
            width: 0;
        }
        .panel:nth-child(even) .speech-bubble { left: auto; right: 10px; }
        .panel:nth-child(even) .speech-bubble::after { left: auto; right: 15px; }
        .panel:nth-child(even) .speech-bubble::before { left: auto; right: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Hệ Thống Tạo Truyện Tranh Tự Động</h1>
    
    <div class="grid-inputs">
        <div class="form-group">
            <label>Gemini API Key:</label>
            <input type="password" id="geminiKey" placeholder="Dán mã AIzaSy... tại đây">
        </div>
        <div class="form-group">
            <label>Hugging Face Token:</label>
            <input type="password" id="hfKey" placeholder="Dán mã hf_... tại đây">
        </div>
        <div class="form-group full-width">
            <label>Nhập kịch bản / Dàn ý của bạn:</label>
            <textarea id="outline" placeholder="Nhập nội dung truyện tại đây..."></textarea>
        </div>
    </div>

    <div class="btn-group">
        <button id="genBtn" onclick="generateComic()">Bắt đầu vẽ truyện tranh</button>
        <button id="dlBtn" onclick="downloadComic()">📥 Tải trọn bộ truyện tranh về máy</button>
    </div>
    
    <div class="loading" id="loading">Hệ thống đang phân tích kịch bản và vẽ tranh, vui lòng chờ...</div>

    <div id="downloadArea" class="comic-wrapper" style="display: none;">
        <div class="comic-book" id="comicBook"></div>
    </div>
</div>

<script>
    async function generateComic() {
        const geminiKey = document.getElementById('geminiKey').value.trim();
        const hfKey = document.getElementById('hfKey').value.trim();
        const outline = document.getElementById('outline').value.trim();
        const btn = document.getElementById('genBtn');
        const dlBtn = document.getElementById('dlBtn');
        const loading = document.getElementById('loading');
        const downloadArea = document.getElementById('downloadArea');
        const comicBook = document.getElementById('comicBook');

        if(!geminiKey || !hfKey || !outline) {
            alert("Vui lòng điền đầy đủ thông tin!");
            return;
        }

        btn.disabled = true;
        dlBtn.style.display = "none";
        loading.style.display = "block";
        downloadArea.style.display = "none";
        comicBook.innerHTML = ""; 

        try {
            const geminiUrl = `https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent?key=${geminiKey}`;
            
            const systemPrompt = `Bạn là một biên kịch truyện tranh. Hãy phân tích dàn ý và chia câu chuyện thành một số lượng phân cảnh hợp lý (từ 2 đến 6 phân cảnh) tùy vào độ dài cốt truyện.
            Trả về chuỗi mảng JSON hợp lệ duy nhất (không bọc trong \`\`\`json).
            Cấu trúc:
            [
              {"image_prompt": "Detailed English description for image generation, beautiful anime comic style, clean lines, colorful", "dialogue": "Lời thoại tiếng Việt ngắn"}
            ]
            Dàn ý: "${outline}"`;

            const geminiRes = await fetch(geminiUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: systemPrompt }] }] })
            });

            if (!geminiRes.ok) throw new Error("Mã Gemini API Key không chính xác.");

            const geminiData = await geminiRes.json();
            let rawText = geminiData.candidates[0].content.parts[0].text.trim();
            rawText = rawText.replace(/^```json/i, '').replace(/^```/, '').replace(/```$/, '').trim();
            const comicData = JSON.parse(rawText);

            const hfUrl = "[https://api-inference.huggingface.co/models/stabilityai/stable-diffusion-xl-base-1.0](https://api-inference.huggingface.co/models/stabilityai/stable-diffusion-xl-base-1.0)";
            
            const fetchImage = async (prompt) => {
                const res = await fetch(hfUrl, {
                    method: "POST",
                    headers: { 
                        "Authorization": `Bearer ${hfKey}`, 
                        "Content-Type": "application/json" 
                    },
                    body: JSON.stringify({ inputs: prompt })
                });
                if(!res.ok) throw new Error("Máy chủ vẽ tranh đang bận, vui lòng thử lại sau ít giây.");
                const blob = await res.blob();
                return URL.createObjectURL(blob);
            };

            const imagePromises = comicData.map(async (scene, index) => {
                const panel = document.createElement('div');
                panel.className = 'panel';
                
                if (comicData.length % 2 !== 0 && index === comicData.length - 1) {
                    panel.classList.add('full-row');
                }

                const bubble = document.createElement('div');
                bubble.className = 'speech-bubble';
                bubble.innerText = scene.dialogue;
                
                const img = document.createElement('img');
                img.alt = "Đang vẽ...";
                // Thuộc tính giúp thư viện chụp ảnh không bị lỗi bảo mật (CORS)
                img.crossOrigin = "anonymous"; 
                
                panel.appendChild(bubble);
                panel.appendChild(img);
                comicBook.appendChild(panel);

                try {
                    const imgUrl = await fetchImage(scene.image_prompt);
                    img.src = imgUrl;
                } catch (err) {
                    img.alt = "Lỗi tạo hình";
                }
            });

            await Promise.all(imagePromises);
            downloadArea.style.display = "block";
            dlBtn.style.display = "block"; // Hiện nút tải về khi vẽ xong dữ liệu

        } catch (error) {
            alert("Có lỗi xảy ra: " + error.message);
        } finally {
            btn.disabled = false;
            loading.style.display = "none";
        }
    }

    // Hàm xử lý xuất và tải toàn bộ truyện dưới dạng ảnh PNG
    function downloadComic() {
        const target = document.getElementById('downloadArea');
        
        // Cấu hình html2canvas để xử lý mượt mà ảnh dạng Blob URL
        html2canvas(target, {
            useCORS: true,
            allowTaint: true,
            scale: 2 // Tăng chất lượng ảnh lên gấp đôi cho nét
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'my-ai-comic.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }).catch(err => {
            alert("Không thể tự động xuất ảnh, bạn hãy chụp màn hình điện thoại nhé!");
            console.error(err);
        });
    }
</script>

</body>
</html>
